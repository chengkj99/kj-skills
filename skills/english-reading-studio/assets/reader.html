<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@ · 阅读工作室</title><style>@@CSS@@</style></head>
<body><a class="skip" href="#main">跳到正文</a><header class="hero"><div class="eyebrow">ENGLISH READING STUDIO · 英文阅读工作室</div><h1>@@TITLE@@</h1><p class="meta">@@META@@</p><p>同一篇文章，按你的目标阅读。保留原文，随时回查。</p></header>
<div class="toolbar"><div role="tablist" aria-label="阅读模式"><button id="tab-quick" role="tab" aria-controls="panel-quick" aria-selected="true" tabindex="0" data-mode="quick">01 快速获取知识</button><button id="tab-deep" role="tab" aria-controls="panel-deep" aria-selected="false" tabindex="-1" data-mode="deep">02 深度精读</button><button id="tab-language" role="tab" aria-controls="panel-language" aria-selected="false" tabindex="-1" data-mode="language">03 英语提升</button></div><div class="controls"><button id="toggle-translation" aria-pressed="false">隐藏译文</button><label>字号 <select id="font-size"><option value="17">标准</option><option value="19">大</option><option value="21">更大</option></select></label></div></div>

<div id="status" role="status" aria-live="polite"></div><dialog id="copy-dialog"><h2>复制本段追问</h2><p>复制以下内容，回到 AI 对话继续讨论。</p><textarea aria-label="可复制的追问内容"></textarea><button id="close-dialog">关闭</button></dialog>
